    <title>Gastroplastia Endoscópica Porto Alegre | Avaliação Especializada Urgegastro</title>
    <script>
      try {
        const desc = Object.getOwnPropertyDescriptor(window, 'fetch');
        if (desc && !desc.set) {
          Object.defineProperty(window, 'fetch', {
            ...desc,
            set: function(v) { this._fetch = v; },
            get: function() { return this._fetch || desc.get.call(this); }
          });
        }
      } catch(e) {}
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
